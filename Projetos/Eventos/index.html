<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos
    </title>

    <link rel="stylesheet" href="style.css" media="screen" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body id="body">
    <div class="container" id="div-container">
        <h1>ALFABETO</h1>
        <div class="row">
            <div class="col">
                <label for="letraA">A</label>
                <input type="text" class="form-control" id="letraA">
            </div>
            <div class="col">
                <label for="letraB">B</label>
                <input type="text" class="form-control" id="letraB">
            </div>
            <div class="col">
                <label for="letraC">C</label>
                <input type="text" class="form-control" id="letraC">
            </div>
        </div>
        <br>
        <div class="row">
            <div class="col">
                <label for="letraD">D</label>
                <input type="text" class="form-control" id="letraD">
            </div>
            <div class="col">
                <label for="letraE">E</label>
                <input type="text" class="form-control" id="letraE">
            </div>
            <div class="col">
                <label for="letraF">F</label>
                <input type="text" class="form-control" id="letraF">
            </div>
        </div>
        <br><br>
        
        <h2 class="text-center">Escolha a Letra</h2>
        <table class="table table-bodered" id="table">
            <thead>
                <tr class="table-success text-center">
                    <th colspan="6" scope="row">Letras</th>
                </tr>
            </thead>
            <tbody>
                <tr class="text-center">
                    <td id="A">A</td>
                    <td id="B">B</td>
                    <td id="C">C</td>
                    <td id="D">D</td>
                    <td id="E">E</td>
                    <td id="F">F</td>
                </tr>
            </tbody>
        </table>
    </div>
    <script src="script.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
