<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Jokenpô</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="opcoes">
            <h2>Escolha uma Opção</h2>
            <div class="opcao" id="opc1">1: Pedra</div>
            <div class="opcao" id="opc2">2: Papel</div>
            <div class="opcao" id="opc3">3: Tesoura</div>
        </div>
        <div class="imgs">
            <div class="img_user">
                <p>Jogador</p>
                <img id="imagem_jogador" src="" alt="Escolha do jogador">
            </div>

            <p id="vs">X</p>

            <div class="img_com">
                <p>Computador</p>
                <img id="imagem_com" src="" alt="Escolha do Computador">
            </div>
        </div>
        <br>

        <div>
            <p class="cont_jokenpo"></p>
            <p id="resultado"></p>
            <button id="jogar_nova">Jogar Novamente?</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
